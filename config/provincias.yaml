# Las 24 jurisdicciones de Argentina.
# - id: código INDEC, el mismo que usa la API Georef (verificado contra Georef el 19-11-2026).
# - nombre: nombre oficial en Georef.  corto: cómo se muestra en el dashboard.
# - busqueda: cómo se nombra la jurisdicción en las búsquedas de Google News (una búsqueda por término).
# - ciudades: lugares que se buscan aparte, con los `terminos_ciudades` de config/consultas.yaml. Se buscan
#   por separado porque Google News devuelve menos notas cuando se combinan lugares con OR.
# - capital: localidad capital (nombre de Georef, verificado el 20-11-2026); se usa cuando la nota dice "la capital".
# - alias: otras formas en que las notas nombran a la jurisdicción (para normalizar la extracción).
# - centro: solo donde el centroide de Georef no sirve para el mapa (Tierra del Fuego incluye la Antártida).
# - poblacion: Censo 2022, resultados definitivos (INDEC, Cuadro resumen, c2022_tp_c_resumen.xlsx de censo.gob.ar,
#   leído el 20-11-2026): total de población, incluye viviendas particulares, colectivas y situación de calle.
#   Suma de las 24 jurisdicciones = total del país = 45.892.285.
provincias:
  - id: "02"
    nombre: Ciudad Autónoma de Buenos Aires
    poblacion: 3121707
    corto: CABA
    capital: Ciudad de Buenos Aires
    busqueda: '"Ciudad de Buenos Aires"'
    ciudades: [CABA, porteño, porteña]
    alias: [CABA, Capital Federal, Ciudad de Buenos Aires, Ciudad Autónoma de Buenos Aires]
