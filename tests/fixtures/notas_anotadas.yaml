# 20 notas reales anotadas para medir la precisión de la extracción (tests/medir_extraccion.py).
#
# ESTADO: BORRADOR. Las anotó Claude Code leyendo cada nota el 19-11-2026; el equipo del Observatorio tiene
# que revisarlas (abrir cada URL y corregir lo que haga falta). Hasta entonces la precisión es preliminar.
#
# No se guardan títulos ni textos (traen nombres de personas y son material de terceros): el script los baja
# de la URL al medir y los deja en la caché temporal (data/cache/textos/fixtures, fuera de git).
#
# Cómo se compara cada campo:
# - un valor: tiene que coincidir. `{uno_de: [...]}`: vale cualquiera (casos ambiguos en la nota).
# - provincia: por nombre de config/provincias.yaml. localidad: coincide si una contiene a la otra (sin acentos).
# - via_contiene: palabras que tienen que aparecer en la vía extraída.
# - vehiculos, grupos_etarios, factores: el conjunto tiene que ser igual.
# - heridos_total: suma de graves, leves y sin detalle (null si la nota no informa heridos).
# - Un campo que no figura acá no se evalúa.

